name: Future OS CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.5
      # The repository currently has no committed bun.lock, so frozen-lockfile cannot succeed.
      # Keep CI runnable until a generated lockfile is committed.
      - run: bun install
      - run: bun run lint
      - run: bun run test
      - run: bun run build

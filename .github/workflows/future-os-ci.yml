name: Future OS CI

on:
  push:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: future-os-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, test, and production build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NPM_CONFIG_FUND: false
      NPM_CONFIG_AUDIT: false
      HUSKY: 0
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.5

      - name: Show environment and tool versions
        shell: bash
        run: |
          set -euxo pipefail
          echo "## Runtime"
          echo "---"
          echo "Node: $(node --version)"
          echo "Bun: $(bun --version)"
          echo "OS: $(uname -a)"
          echo "PWD: $(pwd)"
          echo "---"
          echo "npm config"
          npm config get registry || true
          echo "bun config"
          bun pm --help >/dev/null || true

      - name: Install locked dependencies
        id: install
        shell: bash
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euxo pipefail
          echo "Using registry: $(npm config get registry)"
          echo "NPM_TOKEN present: ${NPM_TOKEN:+yes}"
          bun install --frozen-lockfile --verbose

      - name: ESLint
        id: lint
        shell: bash
        run: |
          set -euxo pipefail
          bun run lint

      - name: Unit and contract tests
        id: test
        shell: bash
        run: |
          set -euxo pipefail
          bun run test

      - name: Production build
        id: build
        shell: bash
        run: |
          set -euxo pipefail
          bun run build

      - name: Write check summary
        if: always()
        env:
          INSTALL_OUTCOME: ${{ steps.install.outcome }}
          LINT_OUTCOME: ${{ steps.lint.outcome }}
          TEST_OUTCOME: ${{ steps.test.outcome }}
          BUILD_OUTCOME: ${{ steps.build.outcome }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          {
            echo "## Future OS CI result"
            echo
            echo "- Commit: $COMMIT_SHA"
            echo "- Dependency install: **$INSTALL_OUTCOME**"
            echo "- ESLint: **$LINT_OUTCOME**"
            echo "- Tests: **$TEST_OUTCOME**"
            echo "- Production build: **$BUILD_OUTCOME**"
            echo
            echo "A skipped step is not a pass. Inspect the corresponding step log for the first failure."
          } >> "$GITHUB_STEP_SUMMARY"

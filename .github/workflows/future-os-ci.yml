name: Future OS CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        continue-on-error: true
        with:
          bun-version: 1.3.5
      - name: Runtime diagnostics
        run: |
          {
            echo "node=$(node --version)"
            echo "bun=$(bun --version 2>&1 || true)"
            echo "pwd=$(pwd)"
          } | tee ci-runtime.log
      - run: bun install --frozen-lockfile 2>&1 | tee ci-install.log
        continue-on-error: true
      - run: bun run lint 2>&1 | tee ci-lint.log
        continue-on-error: true
      - run: bun run test 2>&1 | tee ci-test.log
        continue-on-error: true
      - run: bun run build 2>&1 | tee ci-build.log
        continue-on-error: true
      - name: Upload CI diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: future-os-ci-${{ github.run_id }}
          path: |
            ci-runtime.log
            ci-install.log
            ci-lint.log
            ci-test.log
            ci-build.log
          if-no-files-found: warn

name: Future OS Runner Probe

on:
  push:
    branches: [future-survival-engine]
  pull_request:
    branches: [main]

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe
        run: |
          {
            echo "runner-ok"
            echo "node=$(node --version)"
            echo "npm=$(npm --version)"
            echo "date=$(date -u +%FT%TZ)"
          } | tee runner-probe.log
      - name: Upload probe
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: future-os-runner-probe-${{ github.run_id }}
          path: runner-probe.log
